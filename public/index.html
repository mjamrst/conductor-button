<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#414440" />
    <meta name="description" content="Conductor, we have a problem. Press, hold, and let it out." />
    <title>Conductor — Emergency Intercom</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preload" href="/audio/conductor.wav" as="fetch" crossorigin />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="carriage" aria-label="Conductor sound button">
      <div class="wall-seam wall-seam--left" aria-hidden="true"></div>
      <div class="wall-seam wall-seam--right" aria-hidden="true"></div>
      <section class="intercom" aria-labelledby="intercom-title">
        <div class="metal-grain" aria-hidden="true"></div>
        <span class="screw screw--tl" aria-hidden="true"></span>
        <span class="screw screw--tr" aria-hidden="true"></span>
        <span class="screw screw--bl" aria-hidden="true"></span>
        <span class="screw screw--br" aria-hidden="true"></span>

        <h1 id="intercom-title">Emergency<br />Intercom</h1>
        <div class="speaker" aria-hidden="true"></div>
        <div class="microphone" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>

        <div class="controls">
          <div class="indicator" aria-hidden="true"><span></span></div>
          <div class="button-housing">
            <button class="talk-button" type="button" aria-label="Hold to play: Conductor, we have a problem" aria-describedby="instructions keyboard-help" aria-pressed="false">
              <span class="button-face" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <p class="instructions" id="instructions">To talk<br /><strong>Press &amp; hold</strong><span>Release to stop</span></p>
        <p class="status" role="status" aria-live="polite">Stand by</p>
        <p class="keyboard-help" id="keyboard-help">Hold the button or space bar</p>
      </section>
      <p class="sr-only">Each new press plays the audio from the beginning. Keep holding to hear the whole clip.</p>
    </main>
    <noscript>This intercom needs JavaScript to play sound.</noscript>
  </body>
</html>
